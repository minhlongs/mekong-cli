# docker-compose.posthog.yml — PostHog self-host on M1 Max
#
# STATUS: DEFERRED — start only when >50 paying customers.
# Gate: SIGNALS_POSTHOG_ENABLED=1 in .env.posthog
#
# Start:
#   cp .env.posthog.template .env.posthog
#   docker compose -f docker-compose.posthog.yml --env-file .env.posthog up -d
#
# Tunnel (CF):
#   cloudflared tunnel route dns mekong posthog.m1max.cashclaw.cc
#   # then add to cloudflared config: localhost:8000 → posthog.m1max.cashclaw.cc
#
# Stop:
#   docker compose -f docker-compose.posthog.yml down
#
# Data persisted in ./posthog-data/ (gitignored)

version: "3.9"

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: posthog
      POSTGRES_USER: posthog
      POSTGRES_PASSWORD: ${POSTHOG_DB_PASSWORD}
    volumes:
      - posthog-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "posthog"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - posthog-redis:/data

  clickhouse:
    image: clickhouse/clickhouse-server:23.12-alpine
    restart: unless-stopped
    volumes:
      - posthog-clickhouse:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    # ClickHouse footprint target: <2GB for first 1M events
    environment:
      CLICKHOUSE_DB: posthog
      CLICKHOUSE_USER: posthog
      CLICKHOUSE_PASSWORD: ${POSTHOG_CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"

  posthog:
    image: posthog/posthog:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      clickhouse:
        condition: service_started
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://posthog:${POSTHOG_DB_PASSWORD}@db:5432/posthog
      REDIS_URL: redis://redis:6379/
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_DATABASE: posthog
      CLICKHOUSE_USER: posthog
      CLICKHOUSE_PASSWORD: ${POSTHOG_CLICKHOUSE_PASSWORD}
      SECRET_KEY: ${POSTHOG_SECRET_KEY}
      SITE_URL: ${POSTHOG_SITE_URL:-https://posthog.m1max.cashclaw.cc}
      IS_BEHIND_PROXY: "true"
      DISABLE_SECURE_SSL_REDIRECT: "true"  # CF tunnel handles TLS
      JS_URL: ${POSTHOG_SITE_URL:-https://posthog.m1max.cashclaw.cc}
    volumes:
      - posthog-data:/var/lib/posthog

volumes:
  posthog-db:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./posthog-data/db
  posthog-redis:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./posthog-data/redis
  posthog-clickhouse:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./posthog-data/clickhouse
  posthog-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./posthog-data/app
