<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Primary Green Gradient (Left Leaf/Wing) -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    
    <!-- Secondary Teal Gradient (Right Leaf/Wing) -->
    <linearGradient id="secondaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    
    <!-- Accent Amber Gradient (House & Wave) -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Left Wing (Green Energy) -->
  <path d="M 46 15 C 26 30, 16 54, 20 74 C 22 79, 26 83, 32 83 C 38 83, 42 75, 44 65 C 46 52, 41 32, 46 15 Z" fill="url(#primaryGrad)" />

  <!-- Right Wing (Flow/Rhythm) -->
  <path d="M 54 15 C 74 30, 84 54, 80 74 C 78 79, 74 83, 68 83 C 62 83, 58 75, 56 65 C 54 52, 59 32, 54 15 Z" fill="url(#secondaryGrad)" />

  <!-- Center House (Real Estate) -->
  <path d="M 50 32 L 64 46 L 59 46 L 59 58 L 41 58 L 41 46 L 36 46 Z" fill="url(#accentGrad)" />

  <!-- Rhythm Wave (Heartbeat/Energy Pulse) -->
  <path d="M 25 70 C 37 60, 42 78, 50 68 C 58 58, 63 76, 75 66" fill="none" stroke="url(#accentGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
