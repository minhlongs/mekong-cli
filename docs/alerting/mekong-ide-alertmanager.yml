# Alertmanager routing template for Mekong-IDE alerts.
#
# Drop-in: reference from your Alertmanager config, or copy/paste the route
# + receiver blocks into an existing config. Placeholder URLs + addresses
# MUST be replaced before deploy — they are intentional sentinels, not
# working endpoints.
#
# Pairs with docs/alerting/mekong-ide-rules.yml (severity + component
# labels on every alert drive the route tree below).
#
# Severity conventions (from mekong-ide-rules.yml):
#   - critical: page immediately — losing money (MekongdCloudSpendHigh),
#     broken pool (AgentForestNoWorkers), broken executor
#     (AgentForestTaskFailureRateHigh)
#   - warning:  next-business-day — degraded quality or underutilization
#
# Component conventions:
#   - mekongd:      routing / cost / feedback quality
#   - agent-forest: multi-tenant runtime / queue / workers

global:
  resolve_timeout: 5m
  # SMTP settings — required when using the email-warnings receiver.
  # smtp_smarthost: 'smtp.example.com:587'
  # smtp_from: 'alertmanager@example.com'
  # smtp_auth_username: 'REPLACE_ME'
  # smtp_auth_password: 'REPLACE_ME'

route:
  receiver: default-drop
  group_by: ['alertname', 'component']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Critical: page on-call via Slack (and optionally PagerDuty).
    - matchers:
        - severity="critical"
      receiver: slack-critical
      continue: true
      group_wait: 10s
      repeat_interval: 1h

    # Warnings: Slack-only digest, slower cadence.
    - matchers:
        - severity="warning"
      receiver: slack-warnings
      group_wait: 1m
      repeat_interval: 12h

receivers:
  # Fallback — silently drops anything not matched. Prevents accidental
  # paging when new alerts are added without a route.
  - name: default-drop

  # Critical: Slack + optional PagerDuty.
  # Replace SLACK_WEBHOOK_URL and uncomment pagerduty_configs if used.
  - name: slack-critical
    slack_configs:
      - api_url: 'REPLACE_WITH_SLACK_WEBHOOK_URL'
        channel: '#mekong-ide-oncall'
        send_resolved: true
        title: '[CRITICAL] {{ .CommonLabels.alertname }}'
        text: |
          *{{ .CommonLabels.component }}*
          {{ range .Alerts }}{{ .Annotations.summary }}
          {{ end }}
    # pagerduty_configs:
    #   - service_key: 'REPLACE_WITH_PAGERDUTY_INTEGRATION_KEY'
    #     severity: critical

  # Warning: Slack digest only.
  - name: slack-warnings
    slack_configs:
      - api_url: 'REPLACE_WITH_SLACK_WEBHOOK_URL'
        channel: '#mekong-ide-alerts'
        send_resolved: true
        title: '[WARN] {{ .CommonLabels.alertname }}'
        text: |
          *{{ .CommonLabels.component }}*
          {{ range .Alerts }}{{ .Annotations.summary }}
          {{ end }}

  # Optional: email receiver — uncomment + wire smtp_* in global section.
  # - name: email-warnings
  #   email_configs:
  #     - to: 'ops@example.com'
  #       headers:
  #         Subject: '[mekong-ide] {{ .CommonLabels.severity }} — {{ .CommonLabels.alertname }}'

# Inhibit example: silence warnings for a component if a critical alert
# for that same component is already firing (reduces alert noise during
# an incident).
inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: ['component']
