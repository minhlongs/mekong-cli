# Grafana dashboard provisioning — loads JSON dashboards from /var/lib/grafana/dashboards
apiVersion: 1

providers:
  - name: mekong-dashboards
    orgId: 1
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
