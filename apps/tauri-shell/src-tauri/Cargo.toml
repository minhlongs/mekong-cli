[package]
name = "mekong-shell"
version = "0.1.0"
description = "Mekong IDE — macOS desktop shell"
authors = ["Mekong Mind <hello@mekongmind.com>"]
license = "MIT"
repository = "https://github.com/longtho638-jpg/mekong-cli"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "mekong_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Strip debug symbols to reduce bundle size
strip = true
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
