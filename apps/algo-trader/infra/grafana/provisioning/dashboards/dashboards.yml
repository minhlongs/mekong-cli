apiVersion: 1

providers:
  # ─────────────────────────────────────────────────────────────────────
  # Algo Trader Dashboards
  # ─────────────────────────────────────────────────────────────────────
  - name: 'algo-trader'
    orgId: 1
    folder: 'Algo Trader'
    folderUid: 'algo-trader'
    type: file
    disableDeletion: false
    editable: true
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
