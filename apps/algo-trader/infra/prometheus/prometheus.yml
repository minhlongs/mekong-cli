global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'algo-trader'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
      timeout: 10s
      path_prefix: /alertmanager

# Load alert rules
rule_files:
  - 'alerts.yml'

scrape_configs:
  # ─────────────────────────────────────────────────────────────────────
  # Prometheus self-monitoring
  # ─────────────────────────────────────────────────────────────────────
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 30s

  # ─────────────────────────────────────────────────────────────────────
  # Algo-Trader Application Metrics
  # Exposes: /metrics endpoint on port 3000 (main app port)
  # ─────────────────────────────────────────────────────────────────────
  - job_name: 'algo-trader'
    static_configs:
      - targets: ['app:3000']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

    # Relabel configs for better metric organization
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '([^:]+):\d+'
        replacement: '${1}'

  # ─────────────────────────────────────────────────────────────────────
  # Nginx Exporter (optional - for reverse proxy monitoring)
  # Requires: nginx/nginx-prometheus-exporter container
  # ─────────────────────────────────────────────────────────────────────
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']
    metrics_path: '/metrics'
    scrape_interval: 15s
    honor_labels: true

  # ─────────────────────────────────────────────────────────────────────
  # PostgreSQL Exporter (optional - for database monitoring)
  # Requires: prometheuscommunity/postgres-exporter container
  # ─────────────────────────────────────────────────────────────────────
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # ─────────────────────────────────────────────────────────────────────
  # Redis Exporter (optional - for Redis monitoring)
  # Requires: oliver006/redis_exporter container
  # ─────────────────────────────────────────────────────────────────────
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # ─────────────────────────────────────────────────────────────────────
  # Node Exporter (optional - for host system metrics)
  # Requires: prom/node-exporter container
  # ─────────────────────────────────────────────────────────────────────
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
    metrics_path: '/metrics'
    scrape_interval: 15s
