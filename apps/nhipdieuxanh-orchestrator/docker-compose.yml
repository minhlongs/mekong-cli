version: '3.8'

services:
  # --- API GATEWAY ---
  gateway:
    image: nginx:alpine
    container_name: ndx-gateway
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
      - ai-service
    networks:
      - ndx-network

  # --- FRONTEND (NEXT.JS) ---
  frontend:
    build:
      context: ../nhipdieuxanh
      dockerfile: ../nhipdieuxanh-orchestrator/docker/Dockerfile.frontend
    container_name: ndx-frontend
    environment:
      - NODE_ENV=production
      - PORT=3000
    expose:
      - "3000"
    networks:
      - ndx-network

  # --- BACKEND (NODE.JS + PRISMA) ---
  backend:
    build:
      context: ../nhipdieuxanh
      dockerfile: ../nhipdieuxanh-orchestrator/docker/Dockerfile.backend
    container_name: ndx-backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/nhipdieuxanh_db?schema=public
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - PORT=3010
    expose:
      - "3010"
    depends_on:
      - postgres
      - kafka
    networks:
      - ndx-network

  # --- AI / ML SERVICE (PYTHON FASTAPI) ---
  ai-service:
    build:
      context: ./mock-services/ai-service
      dockerfile: ../../docker/Dockerfile.ai
    container_name: ndx-ai-service
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/nhipdieuxanh_db
    expose:
      - "5000"
    depends_on:
      - kafka
    networks:
      - ndx-network

  # --- POSTGRESQL DATABASE ---
  postgres:
    image: postgres:15-alpine
    container_name: ndx-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=nhipdieuxanh_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - ndx-network

  # --- EVENT BUS: KAFKA & ZOOKEEPER ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: ndx-zookeeper
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181
      - ZOOKEEPER_TICK_TIME=2000
    networks:
      - ndx-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: ndx-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    networks:
      - ndx-network

  # --- MONITORING: PROMETHEUS & GRAFANA ---
  prometheus:
    image: prom/prometheus:latest
    container_name: ndx-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - ndx-network

  grafana:
    image: grafana/grafana:latest
    container_name: ndx-grafana
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - ndx-network

networks:
  ndx-network:
    driver: bridge

volumes:
  pgdata:
  prometheus_data:
  grafana_data:
