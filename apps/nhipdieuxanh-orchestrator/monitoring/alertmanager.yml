global:
  resolve_timeout: 5m
  # Cấu hình email server cho gửi cảnh báo
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'alertmanager@nhipdieuxanh.vn'
  smtp_auth_username: 'alertmanager'
  smtp_auth_password: 'secret_password_here'
  smtp_require_tls: true

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'slack-notifications'
  routes:
    - match:
        severity: critical
      receiver: 'pagerduty-urgent'
    - match:
        severity: warning
      receiver: 'slack-notifications'

receivers:
  - name: 'slack-notifications'
    slack_configs:
      - api_url: 'https://example.com/slack-webhook-placeholder' # Thay thế bằng webhook thực tế
        channel: '#nhipdieuxanh-alerts'
        send_resolved: true
        icon_emoji: ':fire_engine:'
        title: '[{{ .Status | toUpper }}] Cảnh báo hệ thống Nhịp Điệu Xanh'
        text: >-
          {{ range .Alerts }}
            *Alert:* {{ .Annotations.summary }} - `{{ .Labels.severity }}`
            *Description:* {{ .Annotations.description }}
            *Details:*
            {{ range .Labels.SortedPairs }} • *{{ .Name }}:* `{{ .Value }}`
            {{ end }}
          {{ end }}

  - name: 'pagerduty-urgent'
    email_configs:
      - to: 'devops-team@nhipdieuxanh.vn'
        send_resolved: true
        headers:
          subject: '[URGENT] [{{ .Status | toUpper }}] Cảnh báo khẩn cấp hệ thống Nhịp Điệu Xanh'
