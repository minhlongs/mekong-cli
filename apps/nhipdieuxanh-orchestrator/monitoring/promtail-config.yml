server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Thu thập log từ các container docker đang chạy trong docker-compose
  - job_name: ndx-container-logs
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'

  # Thu thập log tĩnh từ API Gateway Nginx
  - job_name: ndx-nginx-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx-gateway
          __path__: /var/log/nginx/*log
