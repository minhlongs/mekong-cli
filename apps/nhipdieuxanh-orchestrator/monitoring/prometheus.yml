global:
  scrape_interval: 15s # Scrape targets every 15 seconds
  evaluation_interval: 15s # Evaluate rules every 15 seconds

# Alertmanager configuration (optional for alerts routing)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Load rules once and periodically evaluate them according to the global evaluation_interval.
rule_files:
  # - "first_rules.yml"

# Scrape configurations
scrape_configs:
  # 1. API Gateway (Nginx HTTP metrics)
  - job_name: 'nginx-gateway'
    static_configs:
      - targets: ['gateway:80']
    metrics_path: '/stub_status'

  # 2. Next.js Frontend
  - job_name: 'nextjs-frontend'
    static_configs:
      - targets: ['frontend:3000']
    metrics_path: '/api/metrics'

  # 3. Node.js Backend API
  - job_name: 'nodejs-backend'
    static_configs:
      - targets: ['backend:3010']
    metrics_path: '/metrics'

  # 4. Python FastAPI AI Service
  - job_name: 'fastapi-ai'
    static_configs:
      - targets: ['ai-service:5000']
    metrics_path: '/metrics'

  # 5. Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
