groups:
  - name: nhipdieuxanh-alerts
    rules:
      # 1. Cảnh báo khi có lỗi 5xx trên API Gateway quá nhiều (đầu vào hệ thống bị lỗi)
      - alert: APIHighHttp5xxRate
        expr: rate(nginx_http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Tỷ lệ lỗi 5xx cao trên API Gateway"
          description: "Gateway đang ghi nhận tỷ lệ lỗi 5xx > 5% trong vòng 1 phút qua. Trạng thái hiện tại: {{ $value }}%"

      # 2. Cảnh báo khi Database PostgreSQL bị offline
      - alert: DatabaseDown
        expr: pg_up == 0
        for: 30s
        labels:
          severity: page
        annotations:
          summary: "PostgreSQL Database Down"
          description: "Không thể kết nối đến cơ sở dữ liệu PostgreSQL. Toàn bộ tính năng lưu trữ dữ liệu bị gián đoạn."

      # 3. Cảnh báo khi ổ đĩa (Disk) sắp đầy (> 80%)
      - alert: DiskSpaceFillingUp
        expr: (node_filesystem_free_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Dung lượng ổ đĩa sắp hết (< 20% trống)"
          description: "Dung lượng đĩa trống trên node {{ $labels.instance }} hiện tại chỉ còn {{ $value | printf \"%.2f\" }}%."

      # 4. Cảnh báo khi Node.js backend bị down / không phản hồi
      - alert: ServiceDown
        expr: up{job="nodejs-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service Backend mất kết nối"
          description: "Không thể scrap metrics từ backend nodejs-backend trong vòng 1 phút qua."

      # 5. Cảnh báo khi API Latency tăng quá cao (Slow Responses)
      - alert: HighRequestLatency
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "API Latency cao (p95 > 500ms)"
          description: "Thời gian phản hồi p95 của backend đang tăng cao, đạt {{ $value }} giây trong 5 phút qua."
