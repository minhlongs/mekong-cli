[package]
name = "mekong-ide"
version = "0.1.0"
edition = "2021"
description = "Mekong IDE - AI-Operated Development Platform"
authors = ["Mekong CLI Team"]

# Prevents additional console window on Windows
[[bin]]
name = "mekong-ide"
path = "src/main.rs"

[lib]
name = "mekong_ide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri            = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"
reqwest          = { version = "0.12", features = ["json"] }
tokio            = { version = "1",    features = ["full"] }
hostname         = "0.4"
sysinfo          = "0.32"

[profile.release]
# LTO improves binary size and startup speed
lto       = true
strip     = true
opt-level = "s"
