# redirects.yaml
# 301 redirect map: legacy subdomains → canonical URLs
# Implementation: Cloudflare Bulk Redirects (Rules > Redirect Rules)
# Verified live: 2026-04-17 (curl -sI confirms 301 + Location header)
#
# HOW TO APPLY:
#   Option A (Recommended): CF Dashboard > Your Zone > Rules > Redirect Rules > Bulk Redirects
#   Option B: wrangler (see deploy.sh)
#   Option C: Workers redirect script (packages/redirect-worker/ — see phase plan)
#
# DO NOT use Vercel rewrites. CF Bulk Redirects are $0 and native.

version: "1.0"
account: longtho638-jpg
last_verified: 2026-04-17

# ─── ACTIVE REDIRECTS (verified 2026-04-17) ────────────────────────────────
# These are already live in CF dashboard. Documented here as source of truth.

active:
  - id: agencyos-app-to-dashboard
    source_url: https://app.agencyos.network/*
    target_url: https://agencyos.network/dashboard/
    status_code: 301
    preserve_path: false
    http_status_verified: 301
    location_verified: https://agencyos.network/dashboard/
    notes: >
      Old app.* subdomain → unified monolith /dashboard.
      Supabase auth redirect URLs must include agencyos.network/dashboard/* (TODO: verify).

  - id: agencyos-dashboard-alias
    source_url: https://dashboard.agencyos.network/*
    target_url: https://agencyos.network/dashboard/
    status_code: 301
    preserve_path: false
    http_status_verified: 301
    location_verified: https://agencyos.network/dashboard/
    notes: Duplicate of app.* — both point to same destination.

  - id: agencyos-docs-to-monolith
    source_url: https://docs.agencyos.network/*
    target_url: https://agencyos.network/docs/
    status_code: 301
    preserve_path: false
    http_status_verified: 301
    location_verified: https://agencyos.network/docs/
    notes: >
      Old mekong-docs CF Pages project redirected here.
      Path-preserving redirect preferred but not active — set preserve_path: true
      if CF Bulk Redirects supports wildcard capture on free plan.

  - id: agencyos-landing-alias
    source_url: https://landing.agencyos.network/*
    target_url: https://agencyos.network/
    status_code: 301
    preserve_path: false
    http_status_verified: 301
    location_verified: https://agencyos.network/
    notes: Old landing v2 subdomain. Dead Polar links removed in Phase 2.

# ─── PENDING REDIRECTS (not yet applied) ────────────────────────────────────
# These need manual CF dashboard action or wrangler apply.

pending:
  - id: agencyos-sophia-to-root
    source_url: https://sophia.agencyos.network/*
    target_url: https://agencyos.network/
    status_code: 301
    preserve_path: false
    http_status_current: 200  # Currently returns 200 (Worker live), NOT a redirect
    priority: LOW
    notes: >
      sophia.agencyos.network currently serves live Sophia AI Factory Worker (HTTP 200).
      DO NOT redirect until Sophia migrates to standalone domain or is deprecated.
      RISK: Breaking Sophia prod if redirected prematurely.
      Action: HOLD until Sophia product decision made.

  - id: http-to-https-agencyos
    source_url: http://agencyos.network/*
    target_url: https://agencyos.network/
    status_code: 301
    preserve_path: true
    http_status_current: unknown
    priority: HIGH
    notes: >
      HTTP→HTTPS redirect. CF typically handles this via "Always Use HTTPS" toggle.
      Verify: CF Dashboard > SSL/TLS > Edge Certificates > Always Use HTTPS = ON.
      If not, add redirect rule here.

  - id: http-to-https-cashclaw
    source_url: http://cashclaw.cc/*
    target_url: https://cashclaw.cc/
    status_code: 301
    preserve_path: true
    http_status_current: unknown
    priority: HIGH
    notes: Same as agencyos — verify Always Use HTTPS in CF dashboard.

  - id: http-to-https-wellnexus
    source_url: http://wellnexus.vn/*
    target_url: https://wellnexus.vn/
    status_code: 301
    preserve_path: true
    http_status_current: unknown
    priority: HIGH
    notes: Same as above.

  - id: mekong-landing-vercel-decommission
    source_url: https://mekong-landing.vercel.app/*
    target_url: https://mekongmind.com/
    status_code: 301
    preserve_path: false
    http_status_current: unknown
    priority: MEDIUM
    notes: >
      mekong-landing repo homepage is https://mekong-landing.vercel.app (Vercel — BANNED).
      Action: (1) Delete Vercel project, (2) CF Pages deploy mekong-landing,
      (3) update repo homepage to mekongmind.com.
      BLOCKED on: mekongmind.com CF project identification (see gap in production-domains.yaml).

# ─── POLAR CHECKOUT URLS (DO NOT REDIRECT) ──────────────────────────────────
# Per phase-b4 requirement: Polar URLs must remain unchanged after cutover.
# These paths must NOT be in any redirect rule's source pattern.

polar_protected_paths:
  - pattern: "*/checkout/*"
    canonical_base: agencyos.network
    notes: Polar.sh checkout paths — preserve as-is. A1 phase monitors these.

  - pattern: "*/api/polar/*"
    canonical_base: api.agencyos.network
    notes: Polar webhook handler on mekong-engine Workers. Never redirect this.
