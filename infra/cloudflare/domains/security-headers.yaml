# security-headers.yaml
# Security headers for all Cloudflare-hosted domains
# Implementation: CF Transform Rules > Modify Response Header
# Reference: https://developers.cloudflare.com/rules/transform/response-header-modification/
#
# IMPORTANT: Apply CSP as Report-Only first (24h) before enforcing,
# to avoid breaking IDE UI (concurrent Phase B1).
# See risk in phase-b4: "CSP header breaks B1 IDE UI → Deploy CSP as Report-Only first"

version: "1.0"
last_updated: 2026-04-17

# ─── GLOBAL HEADERS (apply to ALL zones) ────────────────────────────────────
# Apply via CF Transform Rule with condition: hostname wildcard *.agencyos.network
# OR per-zone rules for cashclaw.cc, wellnexus.vn

global:
  - header: Strict-Transport-Security
    value: "max-age=31536000; includeSubDomains; preload"
    action: set
    priority: CRITICAL
    notes: >
      HSTS 1-year. Required for HSTS preload list submission.
      Prerequisite: all subdomains must serve HTTPS (no HTTP-only subdomains).
      Verify subdomains before enabling includeSubDomains.

  - header: X-Frame-Options
    value: "DENY"
    action: set
    priority: HIGH
    notes: >
      Prevents clickjacking. Use SAMEORIGIN if any iframe embeds needed
      (e.g., dashboard embedding external widgets). Default: DENY.

  - header: X-Content-Type-Options
    value: "nosniff"
    action: set
    priority: HIGH
    notes: Prevents MIME-type sniffing attacks.

  - header: Referrer-Policy
    value: "strict-origin-when-cross-origin"
    action: set
    priority: MEDIUM
    notes: Sends full path on same-origin, only origin on cross-origin HTTPS.

  - header: Permissions-Policy
    value: "camera=(), microphone=(), geolocation=(), payment=()"
    action: set
    priority: MEDIUM
    notes: Disable browser features not used by any Mekong product.

# ─── CORS HEADERS (API zones only) ─────────────────────────────────────────
# Apply ONLY to api.agencyos.network (mekong-engine Workers)
# Workers code should set these — CF Transform Rules as fallback only

api_cors:
  zone: api.agencyos.network
  headers:
    - header: Access-Control-Allow-Origin
      value: "https://agencyos.network"
      action: set
      notes: >
        Restrict to canonical domain only. Remove old subdomain origins.
        Phase 5 TODO: update mekong-engine CORS allowlist to match.
        DO NOT use wildcard (*) — breaks auth cookie sending.

    - header: Access-Control-Allow-Methods
      value: "GET, POST, PUT, DELETE, OPTIONS"
      action: set

    - header: Access-Control-Allow-Headers
      value: "Content-Type, Authorization, X-Requested-With"
      action: set

    - header: Access-Control-Max-Age
      value: "86400"
      action: set
      notes: Preflight cache 24h.

# ─── CSP (deploy as Report-Only FIRST, then enforce after 24h) ──────────────
# Phase B1 (IDE UI) runs concurrently — CSP enforcement may break it.
# Step 1: Deploy Content-Security-Policy-Report-Only for 24h
# Step 2: Monitor CF logs for violations
# Step 3: Promote to Content-Security-Policy

csp:
  report_only_first: true
  report_uri: "https://api.agencyos.network/csp-report"

  zones:
    - zone: agencyos.network
      policy: >
        default-src 'self';
        script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com;
        img-src 'self' data: https:;
        connect-src 'self' https://api.agencyos.network https://nowpayments.io;
        frame-ancestors 'none';
        upgrade-insecure-requests;
      notes: >
        'unsafe-inline' included for Astro hydration. Remove after auditing
        inline scripts. upgrade-insecure-requests handles HTTP→HTTPS for assets.

    - zone: cashclaw.cc
      policy: >
        default-src 'self';
        script-src 'self' 'unsafe-inline';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: https:;
        connect-src 'self' https://api.agencyos.network;
        frame-ancestors 'none';
        upgrade-insecure-requests;

    - zone: wellnexus.vn
      policy: >
        default-src 'self';
        script-src 'self' 'unsafe-inline';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: https:;
        connect-src 'self' https://api.agencyos.network;
        frame-ancestors 'none';
        upgrade-insecure-requests;

# ─── APPLICATION ORDER ───────────────────────────────────────────────────────
# Apply in this order to avoid conflicts:
# 1. HSTS (global)
# 2. X-Frame-Options (global)
# 3. X-Content-Type-Options (global)
# 4. Referrer-Policy (global)
# 5. Permissions-Policy (global)
# 6. CORS (api zone only)
# 7. CSP Report-Only (all zones, 24h monitoring)
# 8. CSP Enforce (after B1 IDE UI confirmed stable)
