[tool.poetry]
name = "agent-core"
version = "0.1.0"
description = "Seed-phase agent kernel — BaseAgent + Memory + Tools backed by mekongd."
authors = ["Mekong CLI <cashback.mentoring@gmail.com>"]
readme = "README.md"
packages = [{ include = "agent_core", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
httpx = "^0.27"
pydantic = "^2.6"
typer = ">=0.15,<0.25"

[tool.poetry.group.vector]
optional = true

[tool.poetry.group.vector.dependencies]
chromadb = "^0.4.24"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1"
pytest-asyncio = "^0.23"
respx = "^0.21"
ruff = "^0.4"

[tool.poetry.scripts]
agent-core = "agent_core.cli:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
