[tool.poetry]
name = "mekongd"
version = "0.1.0"
description = "Local Qwen3.6-35B-A3B daemon with Anthropic-compat proxy — cost-saver for CC CLI heavy users"
authors = ["Mekong <admin@mekongmind.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "mekongd", from = "src"}]

[tool.poetry.scripts]
mekongd = "mekongd.cli:app"

[tool.poetry.dependencies]
python = ">=3.11,<3.16"
typer = ">=0.12.0"
rich = "^13.7.0"
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
sse-starlette = "^2.0.0"
httpx = ">=0.26.0,<0.28"
tomli = "^2.0.0"

[tool.poetry.group.mlx.dependencies]
# Apple Silicon only — install via: poetry install --with mlx
mlx = {version = "^0.20.0", markers = "sys_platform == 'darwin' and platform_machine == 'arm64'"}
mlx-lm = {version = "^0.20.0", markers = "sys_platform == 'darwin' and platform_machine == 'arm64'"}

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.1"
pytest-cov = "^4.1.0"
respx = "^0.20.0"
ruff = "^0.1.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "requires_mlx: requires Apple Silicon + MLX installed (skipped in CI)",
    "requires_model: requires Qwen3.6 weights downloaded locally",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
