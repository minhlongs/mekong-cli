[tool.poetry]
name = "agent-forest"
version = "0.1.0"
description = "Forest-phase multi-tenant gateway + worker pool over agent-core."
authors = ["Mekong CLI <cashback.mentoring@gmail.com>"]
readme = "README.md"
packages = [{ include = "agent_forest", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111"
uvicorn = { version = "^0.30", extras = ["standard"] }
redis = "^5.0"
python-jose = { version = "^3.3", extras = ["cryptography"] }
passlib = { version = "^1.7", extras = ["bcrypt"] }
bcrypt = "<4.1"  # passlib 1.7.4 incompatible with bcrypt>=4.1
pydantic = "^2.6"
httpx = "^0.27"
slowapi = "^0.1.9"
pyyaml = "^6.0"
typer = ">=0.15,<0.25"
agent-core = { path = "../agent-core", develop = true }
docker = { version = "^7.0", optional = true }

[tool.poetry.extras]
docker = ["docker"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.1"
pytest-asyncio = "^0.23"
fakeredis = "^2.23"
respx = "^0.21"
ruff = "^0.4"

[tool.poetry.scripts]
agent-forest = "agent_forest.cli:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI uses Depends/Header/Query in argument defaults — idiomatic, not a bug.
"src/agent_forest/gateway/*.py" = ["B008"]
