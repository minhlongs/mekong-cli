[pytest]
testpaths = tests
pythonpath = src
# Exclude monorepo subdirectories that have their own tests
norecursedirs = node_modules .archive apps packages vendor .git __pycache__ dist build *.egg-info
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = -v --tb=short
markers =
    unit: Unit tests (fast, no external deps)
    integration: Integration tests (may need mocks)
    slow: Tests that are slow to run
    asyncio: Asyncio tests
