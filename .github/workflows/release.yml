name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  generate-changelog:
    runs-on: ubuntu-latest
    outputs:
      changelog: ${{ steps.changelog.outputs.changelog }}
      version: ${{ steps.vars.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: vars
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v4
        with:
          commitMode: true
          fromTag: v${{ steps.vars.outputs.version }}
          toTag: HEAD
          configFile: .github/release-changelog-config.json
          outputFile: changelog.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-python:
    needs: generate-changelog
    runs-on: ubuntu-latest
    outputs:
      python-dist: ${{ steps.dist.outputs.dist-path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -

      - name: Build package
        run: |
          poetry build

      - name: Upload artifact
        id: dist
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

  create-release:
    needs: [generate-changelog, build-python]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Python artifact
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: python-dist/

      - name: Get changelog
        run: |
          cat changelog.md > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.generate-changelog.outputs.version }}
          name: Release v${{ needs.generate-changelog.outputs.version }}
          body_path: release_notes.md
          files: |
            python-dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-pypi:
    needs: create-release
    runs-on: ubuntu-latest
    if: ${{ contains(github.ref, 'v') && github.event_name == 'push' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -

      - name: Download Python artifact
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - name: Publish to PyPI
        run: |
          poetry publish --username __token__ --password ${{ secrets.PYPI_API_TOKEN }} dist/*
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_API_TOKEN }}

  notify:
    needs: [create-release, publish-pypi]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Notify Slack
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#releases'
          text: |
            🚀 Mekong CLI Release v${{ needs.generate-changelog.outputs.version }}
            • GitHub Release: https://github.com/${{ github.repository }}/releases/tag/v${{ needs.generate-changelog.outputs.version }}
            • PyPI: ${{ needs.publish-pypi.outcome == 'success' && '✅ Published' || '⏭️ Skipped' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}