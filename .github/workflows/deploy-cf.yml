name: Deployment CI/CD

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

concurrency:
  group: deploy-cf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [dashboard, api]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: ${{ matrix.service == 'dashboard' }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Dashboard Open-Core Routes
        if: ${{ matrix.service == 'dashboard' }}
        run: |
          test -f apps/dashboard/package.json
          test -f apps/dashboard/app/checkout/demo/page.tsx
          test -f apps/dashboard/app/dashboard/settings/page.tsx
          test -f apps/dashboard/app/dashboard/revenue/page.tsx
          test -f apps/dashboard/app/api/polar/webhook/route.ts
          echo "Dashboard 25-Step Open-Core routes verified."

      - name: Setup Python
        if: ${{ matrix.service == 'api' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies (api)
        if: ${{ matrix.service == 'api' }}
        run: |
          pip install -r requirements.txt
          pip install "ruff>=0.15,<0.16" pytest pytest-asyncio anyio "httpx<0.28"
          pip install -e .

      - name: Lint & Test Open-Core API Readiness
        if: ${{ matrix.service == 'api' }}
        env:
          PYTHONPATH: ${{ github.workspace }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-placeholder' }}
          NO_COLOR: "1"
          TERM: "dumb"
        run: |
          ruff check src/core/opencore/
          pytest tests/test_opencore_saas_25_step_suite.py tests/test_github_content_25_step_sync.py -q

  deploy-api-staging:
    needs: verify
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/staging' }}
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Workers (staging)
        if: ${{ env.CF_API_TOKEN != '' }}
        run: |
          npm install -g wrangler
          wrangler deploy --env staging --remote
          bash ci/helpers/post-deploy-smoke.sh api "https://mekong-api.workers.dev/healthz"

      - name: Notify deployment
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#deployments'
          text: |
            ${{ job.status == 'success' && '✅' || '❌' }} API staging deployment
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}

  deploy-api-production:
    needs: [verify]
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Workers (production)
        if: ${{ env.CF_API_TOKEN != '' }}
        run: |
          npm install -g wrangler
          echo "${{ github.sha }}" > .deploy-commit
          wrangler deploy --env production --remote
          bash ci/helpers/post-deploy-smoke.sh api "https://mekong-api.workers.dev/healthz"

      - name: Skip notice when CF_API_TOKEN not configured
        if: ${{ env.CF_API_TOKEN == '' }}
        run: |
          echo "CF_API_TOKEN not configured in OSS repository; skipping Cloudflare production deploy."

      - name: Notify deployment
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#deployments'
          text: |
            ${{ job.status == 'success' && '✅' || '❌' }} API production deployment
            Commit: ${{ github.sha }}

  deploy-dashboard:
    needs: [verify]
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging') }}
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        if: ${{ env.CF_API_TOKEN != '' }}
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          projectName: mekong-dashboard
          directory: apps/dashboard
          branch: ${{ github.ref == 'refs/heads/main' && 'main' || 'staging' }}
          wranglerVersion: '3'

      - name: Skip notice when CF_API_TOKEN not configured
        if: ${{ env.CF_API_TOKEN == '' }}
        run: |
          echo "CF_API_TOKEN not configured in OSS repository; skipping Cloudflare Pages deploy."

      - name: Notify deployment
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#deployments'
          text: |
            ${{ job.status == 'success' && '✅' || '❌' }} Dashboard deployment
            Commit: ${{ github.sha }}
