name: Deploy Gateway to Fly.io

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'src/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'Dockerfile'
      - 'fly.toml'
      - '.github/workflows/deploy-gateway.yml'
  workflow_dispatch:

concurrency:
  group: deploy-gateway-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test before deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run gateway tests
        run: |
          python -m pytest tests/ -k "gateway or healthz or polar_webhook" -x --no-header -q

  deploy:
    name: Deploy to Fly.io
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: flyctl deploy --remote-only --strategy=rolling
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Smoke test production
        run: |
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api.mekong.dev/healthz || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then exit 0; fi
            sleep 5
          done
          echo "Production smoke test failed"
          exit 1
