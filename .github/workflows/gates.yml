name: Quality Gates

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # ------------------------------------------------------------------ #
  # G1 — VALIDATION: lint, type-check, unit tests                       #
  # ------------------------------------------------------------------ #
  g1-validation:
    name: G1 Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python deps
        run: |
          pip install -r requirements.txt
          # Pin below 0.16: that major expanded the default rule set (59 → 413) and flags the tree.
          pip install "ruff>=0.15,<0.16" pyright pytest pytest-asyncio pytest-cov anyio "httpx<0.28"
          pip install -e .

      - name: Ruff lint
        run: ruff check src/ tests/

      - name: SBOM generator runs
        # The public OSS surface advertises an SBOM; this keeps that claim true
        # by proving the generator works on every PR. The artifact is generated
        # in CI rather than committed: it lists every first-party component with
        # a content hash, so committing it would churn on every source edit.
        run: |
          python3 scripts/generate-sbom.py > "$RUNNER_TEMP/sbom.json"
          python3 - <<'PY'
          import json, os
          bom = json.load(open(os.environ["RUNNER_TEMP"] + "/sbom.json"))
          assert bom["bomFormat"] == "CycloneDX", bom["bomFormat"]
          assert bom["specVersion"] == "1.5", bom["specVersion"]
          assert len(bom["components"]) > 1000, len(bom["components"])
          print(f"SBOM OK: {len(bom['components'])} components")
          PY

      - name: Pyright type check
        run: pyright src/ --pythonversion 3.12
        continue-on-error: true

      - name: Open-Core 25-Step & RaaS Boundary Gate
        run: |
          pytest \
            tests/test_opencore_saas_25_step_suite.py \
            tests/test_core_boundary.py \
            tests/test_dual_rail_checkout.py \
            tests/test_raas_license_verifier.py \
            tests/test_idea_run_blueprint_writing.py \
            tests/test_opencore_git_boundary_guard.py \
            tests/test_durian_grab_honest_diagnosis.py \
            tests/test_github_content_25_step_sync.py \
            tests/test_dashboard_opencore_sync.py \
            tests/test_opc_platform_contract.py \
            tests/test_opc_production_callers.py \
            tests/test_opc_approval_security.py \
            tests/test_quarantine_floor.py \
            tests/test_pilot_a_e2e.py \
            tests/test_mekong_bench.py \
            tests/test_strategy_e_pilot_a.py \
            tests/test_strategy_e_billing_reconcile.py \
            tests/test_strategy_c_legal_pricing.py \
            tests/test_strategy_c_runtime.py \
            tests/test_strategy_c_http_gateway.py \
            tests/test_sc08_payment_integrity.py \
            tests/test_sc08_auth_tenant_isolation.py \
            tests/test_sc08_dashboard_bff.py \
            tests/test_sc08_pilot_a_e2e_rehearsal.py \
            tests/test_promise_spine_wave1.py \
            tests/test_promise_finance_ops.py \
            tests/test_promise_opc_zalo_ops.py \
            tests/test_promise_wave3_ops.py \
            tests/test_promise_wave4_ops.py \
            tests/test_promise_wave5_ops.py \
            tests/test_product_promise_fullstack.py \
            tests/test_core_dna.py \
            tests/test_core_dna_workflow.py \
            -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-placeholder' }}
          NO_COLOR: "1"
          TERM: "dumb"

      - name: Python unit tests
        run: |
          pytest tests/core/ tests/cli/ tests/seed/ tests/commands/ tests/auth/ tests/unit/ tests/daemon/ tests/vn/ tests/design_intelligence/ \
            tests/test_billing.py \
            tests/test_nowpayments_ipn_golden.py \
            tests/test_promise_spine_wave1.py \
            tests/test_promise_finance_ops.py \
            tests/test_promise_opc_zalo_ops.py \
            tests/test_promise_wave3_ops.py \
            tests/test_promise_wave4_ops.py \
            tests/test_promise_wave5_ops.py \
            tests/test_strategy_c_legal_pricing.py \
            tests/test_strategy_c_runtime.py \
            tests/test_strategy_c_http_gateway.py \
            tests/test_sc08_payment_integrity.py \
            tests/test_sc08_auth_tenant_isolation.py \
            tests/test_sc08_pilot_a_e2e_rehearsal.py \
            -v --tb=short \
            --cov=src \
            --cov-report=xml \
            --cov-fail-under=25
        env:
          PYTHONPATH: ${{ github.workspace }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-placeholder' }}
          NO_COLOR: "1"
          TERM: "dumb"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g1-coverage
          path: coverage.xml
          retention-days: 14

  # ------------------------------------------------------------------ #
  # G2 — SECURITY: semgrep, bandit, trivy                               #
  # ------------------------------------------------------------------ #
  g2-security:
    name: G2 Security
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install security tools
        run: pip install bandit semgrep pip-audit

      - name: Bandit static analysis (blocking High across src/, Medium+ on OPC/OpenCore)
        run: |
          bandit -r src/ -lll -q
          bandit -r src/opc/ src/core/opencore/ src/core/raas_license_verifier.py src/seed/ integrations/ -ll -q

      - name: Semgrep scan (blocking ERROR severity across src/)
        run: semgrep --config=p/python --config=p/secrets src/ --severity=ERROR --error --exclude=node_modules --exclude=.venv --exclude=dist

      - name: Resolve and freeze canonical Python dependencies
        run: |
          python -m venv "$RUNNER_TEMP/trivy-venv"
          "$RUNNER_TEMP/trivy-venv/bin/pip" install -q -r requirements.txt
          mkdir -p "$RUNNER_TEMP/trivy-deps"
          "$RUNNER_TEMP/trivy-venv/bin/pip" freeze --exclude-editable > "$RUNNER_TEMP/trivy-deps/requirements.txt"
          pkg_count=$(grep -c "==" "$RUNNER_TEMP/trivy-deps/requirements.txt")
          echo "Resolved $pkg_count pinned Python packages for vulnerability gate"
          test "$pkg_count" -ge 30

      - name: pip-audit on resolved runtime dependencies (blocking)
        run: pip-audit -r "$RUNNER_TEMP/trivy-deps/requirements.txt"

      - name: Trivy scan on resolved requirements.txt (blocking HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ runner.temp }}/trivy-deps
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          format: table

  # ------------------------------------------------------------------ #
  # G3 — QUALITY: Python coverage >= 28%                                #
  # ------------------------------------------------------------------ #
  g3-quality:
    name: G3 Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python deps
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov anyio "httpx<0.28"
          pip install -e .

      - name: Python coverage check
        run: |
          pytest tests/core/ tests/cli/ tests/seed/ tests/commands/ tests/auth/ tests/unit/ tests/daemon/ tests/vn/ \
            tests/test_promise_spine_wave1.py \
            tests/test_promise_finance_ops.py \
            tests/test_promise_opc_zalo_ops.py \
            tests/test_promise_wave3_ops.py \
            tests/test_promise_wave4_ops.py \
            tests/test_promise_wave5_ops.py \
            tests/test_strategy_c_legal_pricing.py \
            tests/test_strategy_c_runtime.py \
            tests/test_strategy_c_http_gateway.py \
            tests/test_sc08_payment_integrity.py \
            tests/test_sc08_auth_tenant_isolation.py \
            tests/test_sc08_pilot_a_e2e_rehearsal.py \
            --cov=src \
            --cov-report=xml \
            --cov-fail-under=25 \
            -q --tb=no
          bash ci/helpers/coverage-threshold.sh coverage.xml 25
        env:
          PYTHONPATH: ${{ github.workspace }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-placeholder' }}
          NO_COLOR: "1"
          TERM: "dumb"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g3-coverage
          path: coverage.xml
          retention-days: 14

  # ------------------------------------------------------------------ #
  # G4 — DEPENDENCY AUDIT: osv-scanner                                  #
  # ------------------------------------------------------------------ #
  g4-dep-audit:
    name: G4 Dep Audit
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - name: OSV Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v1.9.0
        with:
          scan-args: |-
            --config=ci/config/osv-scanner.toml
            --recursive
            .
        continue-on-error: true

  # ------------------------------------------------------------------ #
  # G5 — DEPLOY READY: wrangler dry-run (needs g1..g4)                  #
  # ------------------------------------------------------------------ #
  g5-deploy-ready:
    name: G5 Deploy Ready
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [g1-validation, g2-security, g3-quality, g4-dep-audit]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Verify wrangler config exists
        run: |
          bash ci/helpers/run-gate.sh "wrangler-config" \
            "test -f packages/mekong-engine/wrangler.toml && echo 'wrangler.toml found' || (echo 'WARN: wrangler.toml missing' && exit 0)"

      - name: Smoke-test placeholder
        run: |
          echo "Smoke test: gate wired. Real smoke test runs post-deploy in phase-02."

  # ------------------------------------------------------------------ #
  # MERGE GATE — aggregator (required status check for branch protection) #
  # ------------------------------------------------------------------ #
  merge-gate:
    name: Merge Gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [g5-deploy-ready]

    steps:
      - name: All gates passed
        run: echo "All 5 gates green. Merge allowed."
