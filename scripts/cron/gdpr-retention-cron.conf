# GDPR Data Retention Cleanup - Cron Configuration
#
# This file provides example cron configurations for the GDPR data retention
# cleanup script. The script deletes or anonymizes data according to the
# retention periods defined in the GDPR compliance policy.
#
# Requirements:
# - Python 3.9+
# - Mekong CLI environment variables configured
#
# Setup:
# 1. Copy this file to your crontab: crontab -e
# 2. Adjust the schedule and paths as needed
# 3. Test with --dry-run first: python3 /path/to/script.py --dry-run --verbose
#
# Retention periods (as per docs/compliance/gdpr-remediation-tracker-20260620.md):
# - Webhook events: 90 days
# - Poll responses: 2 years
# - Audit logs: 2 years (then anonymize)
# - GDPR audit logs: 7 years
# - Conversion records: 7 years (legal hold - never auto-delete)

# ─────────────────────────────────────────────────────────────────────────────
# RECOMMENDED SCHEDULE
# ─────────────────────────────────────────────────────────────────────────────

# Option A: Daily at 2:00 AM (recommended - catches deletions promptly)
0 2 * * * /opt/homebrew/bin/python3 /path/to/mekong-cli/scripts/gdpr_data_retention_cleanup.py --execute --report 2>&1 | /usr/bin/logger -t gdpr-retention || echo "GDPR retention cleanup failed - check logs"

# Option B: Weekly on Sunday at 3:00 AM (less frequent, lower overhead)
0 3 * * 0 /opt/homebrew/bin/python3 /path/to/mekong-cli/scripts/gdpr_data_retention_cleanup.py --execute --report 2>&1 | /usr/bin/logger -t gdpr-retention || echo "GDPR retention cleanup failed - check logs"

# Option C: Monthly on 1st at 4:00 AM (minimal overhead, slower cleanup)
0 4 1 * * /opt/homebrew/bin/python3 /path/to/mekong-cli/scripts/gdpr_data_retention_cleanup.py --execute --report 2>&1 | /usr/bin/logger -t gdpr-retention || echo "GDPR retention cleanup failed - check logs"

# ─────────────────────────────────────────────────────────────────────────────
# TESTING / DRY-RUN
# ─────────────────────────────────────────────────────────────────────────────

# Run dry-run daily at 6:00 PM to verify script works (no deletions)
0 18 * * * /opt/homebrew/bin/python3 /path/to/mekong-cli/scripts/gdpr_data_retention_cleanup.py --dry-run --verbose 2>&1 | /usr/bin/logger -t gdpr-retention-dryrun

# ─────────────────────────────────────────────────────────────────────────────
# ENVIRONMENT VARIABLES
# ─────────────────────────────────────────────────────────────────────────────
#
# The following environment variables must be set. Add them before the command:
#
# MEKONG_CONFIG_DIR: Path to Mekong config (default: ~/.mekong)
# MEKONG_PILOT_STORAGE: Storage backend (jsonl or sqlite, default: jsonl)
#
# Example with env vars:
# 0 2 * * * cd /path/to/mekong-cli && MEKONG_CONFIG_DIR=~/.mekong /opt/homebrew/bin/python3 scripts/gdpr_data_retention_cleanup.py --execute --report 2>&1 | /usr/bin/logger -t gdpr-retention
#
# ─────────────────────────────────────────────────────────────────────────────
# LOGGING & MONITORING
# ─────────────────────────────────────────────────────────────────────────────
#
# The script logs to:
# - stdout/stderr (captured by cron via | logger)
# - ~/.mekong/gdpr_retention_log.jsonl (structured log entries)
#
# Monitor with:
#   tail -f ~/.mekong/gdpr_retention_log.jsonl
#   grep gdpr-retention /var/log/system.log
#
# Alert if cleanup fails:
# - Check exit code: non-zero = failure
# - Review ~/.mekong/gdpr_retention_log.jsonl for error details
# - Verify disk space before cleanup (script checks automatically)
#
# ─────────────────────────────────────────────────────────────────────────────
# RETENTION PERIODS (for reference)
# ─────────────────────────────────────────────────────────────────────────────
#
# Data Type                    | Retention      | Action
# -----------------------------|----------------|-------------------------------------
# Webhook events               | 90 days        | Delete after 90d
# Poll responses              | 2 years        | Delete after 2y
# Audit logs                  | 2 years        | Anonymize after 2y (keep metadata)
# GDPR audit logs             | 7 years        | Keep (compliance evidence)
# Conversion records          | 7 years        | Keep (legal/financial)
# Pilot records (active)      | Indefinite     | Keep while active
# Pilot records (deleted)     | 30 days        | Anonymize after 30d
# Consent records             | Indefinite     | Keep (proof of lawful basis)
#
# See: docs/privacy/ropa-20260620.md for full retention policy
#
# ─────────────────────────────────────────────────────────────────────────────
# RECOVERY
# ─────────────────────────────────────────────────────────────────────────────
#
# If data is accidentally deleted:
# 1. Restore from backup (D1 export/R2 snapshot)
# 2. Manual intervention required - script does not have undo
#
# Schedule regular backups:
#   See scripts/db-backup.sh for automated D1/KV backups
#
# ─────────────────────────────────────────────────────────────────────────────
