# Database Maintenance - Cron Configuration
#
# This file provides example cron configurations for the database maintenance
# script. The script performs cleanup, vacuum, and statistics updates for SQLite
# databases used by Mekong CLI.
#
# Requirements:
# - Python 3.9+
# - Mekong CLI databases in ~/.mekong/
#
# Setup:
# 1. Copy this file to your crontab: crontab -e
# 2. Adjust the schedule and paths as needed
# 3. Test with --dry-run first: python3 /path/to/script.py --dry-run --verbose
#
# Maintenance operations:
# - Clean up old processed_events records (> 90 days)
# - Vacuum databases to reclaim space (optional, weekly recommended)
# - Update SQLite statistics for query planner
#
# ─────────────────────────────────────────────────────────────────────────────
# RECOMMENDED SCHEDULE
# ─────────────────────────────────────────────────────────────────────────────

# Option A: Daily at 2:00 AM (recommended - keeps DB clean)
0 2 * * * cd /Users/macbook/mekong-cli && /opt/homebrew/bin/python3 scripts/db_maintenance.py --all --log-level INFO 2>&1 | /usr/bin/logger -t db-maintenance || echo "Database maintenance failed - check logs"

# Option B: Weekly on Sunday at 3:00 AM with vacuum (more aggressive)
0 3 * * 0 cd /Users/macbook/mekong-cli && /opt/homebrew/bin/python3 scripts/db_maintenance.py --all --vacuum weekly --log-level INFO 2>&1 | /usr/bin/logger -t db-maintenance || echo "Database maintenance with vacuum failed - check logs"

# Option C: Monthly on 1st at 4:00 AM with full vacuum (maximum cleanup)
0 4 1 * * cd /Users/macbook/mekong-cli && /opt/homebrew/bin/python3 scripts/db_maintenance.py --all --vacuum full --log-level INFO 2>&1 | /usr/bin/logger -t db-maintenance || echo "Monthly database maintenance failed - check logs"

# ─────────────────────────────────────────────────────────────────────────────
# TESTING / DRY-RUN
# ─────────────────────────────────────────────────────────────────────────────

# Run dry-run daily at 6:00 PM to verify script works (no changes)
0 18 * * * cd /Users/macbook/mekong-cli && /opt/homebrew/bin/python3 scripts/db_maintenance.py --dry-run --verbose --log-level DEBUG 2>&1 | /usr/bin/logger -t db-maintenance-dryrun

# ─────────────────────────────────────────────────────────────────────────────
# ENVIRONMENT VARIABLES
# ─────────────────────────────────────────────────────────────────────────────
#
# The script auto-detects database paths from default locations:
# - ~/.mekong/raas/tenants.db
# - ~/.mekong/raas/workspaces.db
#
# If using custom locations, set MEKONG_CONFIG_DIR:
#
# 0 2 * * * cd /path/to/mekong-cli && MEKONG_CONFIG_DIR=/custom/path /opt/homebrew/bin/python3 scripts/db_maintenance.py --all 2>&1 | /usr/bin/logger -t db-maintenance
#
# ─────────────────────────────────────────────────────────────────────────────
# LOGGING & MONITORING
# ─────────────────────────────────────────────────────────────────────────────
#
# The script logs to:
# - stdout/stderr (captured by cron via | logger)
# - ~/.mekong/db_maintenance.log (structured log entries if --log-file used)
#
# Monitor with:
#   tail -f ~/.mekong/db_maintenance.log
#   grep db-maintenance /var/log/system.log
#
# Alert if maintenance fails:
# - Check exit code: non-zero = failure
# - Review log file for error details
# - Verify database files exist and are accessible
#
# ─────────────────────────────────────────────────────────────────────────────
# WHAT GETS CLEANED
# ─────────────────────────────────────────────────────────────────────────────
#
# Table: processed_events
#   - Deletes records older than 90 days (default)
#   - These are transient processing records, safe to delete after 90d
#
# Other tables are NOT modified - vacuum only reorganizes storage.
#
# Retention policy:
# - processed_events: 90 days
# - All other tables: preserved indefinitely
#
# ─────────────────────────────────────────────────────────────────────────────
# VACUUM STRATEGY
# ─────────────────────────────────────────────────────────────────────────────
#
# --vacuum weekly:    VACUUM with default settings (good balance)
# --vacuum full:      VACUUM with FULL option (thorough but slower)
# --vacuum incremental: VACUUM using WAL checkpoint (if WAL enabled)
#
# Recommendation: Use --vacuum weekly on Sundays (Option B above)
#
# ─────────────────────────────────────────────────────────────────────────────
# PERFORMANCE IMPACT
# ─────────────────────────────────────────────────────────────────────────────
#
# - Cleanup: Fast (DELETE with index), minimal lock time
# - ANALYZE: Fast, updates query planner stats
# - VACUUM: Can be slow on large DBs, locks database exclusively
#
# Schedule vacuum during low-usage periods (Sunday 3 AM is safe).
#
# ─────────────────────────────────────────────────────────────────────────────
# RECOVERY
# ─────────────────────────────────────────────────────────────────────────────
#
# Vacuum is safe but irreversible. If issues arise:
# 1. Stop all processes accessing the database
# 2. Restore from backup if available
# 3. Run integrity check: sqlite3 <db> "PRAGMA integrity_check"
#
# Regular backups recommended (see scripts/db-backup.sh)
#
# ─────────────────────────────────────────────────────────────────────────────
# CUSTOMIZATION
# ─────────────────────────────────────────────────────────────────────────────
#
# Adjust retention period:
#   --days 30      # Keep processed_events for 30 days only
#   --days 180     # Keep processed_events for 6 months
#
# Limit to specific database:
#   --db tenants.db    # Only maintain tenants.db
#   --db workspaces.db # Only maintain workspaces.db
#
# Verbose logging:
#   --verbose   # Show detailed progress
#   --dry-run   # Show what would be done without doing it
#
# ─────────────────────────────────────────────────────────────────────────────
