services:
  mekong-ide:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - RAAS_URL=http://raas:8000
    depends_on:
      - raas

  raas:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - raas-data:/data
    environment:
      - NODE_ENV=production

volumes:
  raas-data:
