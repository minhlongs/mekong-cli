services:
  mekong-ide:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - RAAS_URL=http://raas:8000
    depends_on:
      - raas

  raas:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - raas-data:/data
    environment:
      - NODE_ENV=production

  redis:
    image: redis:7-alpine
    profiles: ["memory"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:16-alpine
    profiles: ["memory"]
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_DB=mekong
      - POSTGRES_USER=mekong
      - POSTGRES_PASSWORD=mekong-local-dev
    volumes:
      - postgres-data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.12.4
    profiles: ["memory"]
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  neo4j:
    image: neo4j:5-community
    profiles: ["memory"]
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/mekong-local-dev
    volumes:
      - neo4j-data:/data

  prometheus:
    image: prom/prometheus:v2.51.2
    profiles: ["observability"]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:10.4.2
    profiles: ["observability"]
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  raas-data:
  redis-data:
  postgres-data:
  qdrant-data:
  neo4j-data:
  prometheus-data:
  grafana-data:
